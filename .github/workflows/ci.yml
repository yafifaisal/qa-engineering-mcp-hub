name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv lock --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q
      - run: uv run python scripts/structure_audit.py
      - run: uv run python scripts/build_package.py
      - name: Install the built wheel in a clean environment
        shell: bash
        run: |
          set -eu
          wheel="$(echo dist/*.whl)"
          uv venv /tmp/qa-mcp-install --python "${{ matrix.python-version }}"
          uv pip install --python /tmp/qa-mcp-install/bin/python "$wheel" || \
            uv pip install --python /tmp/qa-mcp-install/Scripts/python.exe "$wheel"
          if [ -x /tmp/qa-mcp-install/bin/qa-mcp ]; then
            /tmp/qa-mcp-install/bin/qa-mcp --version
            uvx --from "$wheel" qa-mcp --version
          else
            /tmp/qa-mcp-install/Scripts/qa-mcp.exe --version
            uvx --from "$wheel" qa-mcp --version
          fi
