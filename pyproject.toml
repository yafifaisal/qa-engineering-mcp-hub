[project]
name = "qa-engineering-mcp-hub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4,<5",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "rich>=13,<15",
    "typer>=0.15,<1",
]

[project.scripts]
qa-mcp = "qa_mcp_hub.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "qa_mcp_hub"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
]
