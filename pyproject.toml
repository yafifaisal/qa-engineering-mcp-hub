[project]
name = "qa-engineering-mcp-hub"
version = "0.1.0"
description = "Local-first FastMCP foundation for governed QA engineering workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==4.1.0",
    "httpx==0.28.1",
    "platformdirs==4.13.3",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "pyyaml==6.0.3",
    "rich==14.3.4",
    "typer==0.27.3",
]

[project.optional-dependencies]
credentials = ["keyring==25.7.0"]

[project.scripts]
qa-mcp = "qa_mcp_hub.cli.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "qa_mcp_hub"

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "keyring==25.7.0",
    "mypy==1.20.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
