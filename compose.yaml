name: qa-engineering-mcp-hub

services:
  hub:
    build:
      context: .
    command: ["serve"]
    stdin_open: true
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    environment:
      QA_MCP_LOG_LEVEL: INFO
      QA_MCP_SERVER_NAME: QA Engineering MCP Hub
    profiles: ["local-container"]
