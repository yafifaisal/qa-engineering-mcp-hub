# Codex local-stdio registration generated by `qa-mcp clients generate codex`.
# `qa-mcp` must be on the client's PATH; use --command for an absolute executable.
# Provider credentials are resolved by qa-mcp and must never be added here.
[mcp_servers.qa_hub]
command = "qa-mcp"
args = ["serve"]
enabled = true
startup_timeout_sec = 10
tool_timeout_sec = 60
